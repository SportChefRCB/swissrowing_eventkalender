name: Update Swiss Rowing calendar

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC (05:17 / 06:17 in Bern)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install rvest
        run: Rscript -e 'install.packages("rvest")'

      - name: Build calendar
        run: Rscript build_ics.R

      - name: Save the new calendar (only if events changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/swissrowing.ics
          if git diff --cached --quiet -I '^DTSTAMP'; then
            echo "No changes in events."
          else
            git commit -m "Update Swiss Rowing calendar"
            git push
          fi
